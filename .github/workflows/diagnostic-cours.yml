# Diagnostic des sources de cours.
# - À la main : onglet Actions → « Diagnostic des cours » → Run workflow.
# - Automatiquement chaque lundi soir : si Euronext ne répond plus, le workflow
#   échoue et GitHub vous prévient par e-mail.
name: Diagnostic des cours

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version attendue sur le site (vide = n'importe laquelle)"
        required: false
        default: ''
  schedule:
    - cron: '23 18 * * 1'   # lundi, après la clôture

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Sources de cours (Euronext + Yahoo de secours)
        run: node tools/check-sources.js PSP5 FR0011871128 DCAM CW8 "Amundi PEA S&P 500 UCITS ETF Acc" "Amundi PEA Monde"

      - name: Site en ligne dans un vrai Chrome (bouton « Actualiser le cours »)
        run: |
          npm install --no-save --no-package-lock playwright-core@1.56.1
          node tools/e2e-live.js "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" "${{ inputs.version }}" PSP5 FR0011871128
